# AMCP GitHub Pages Configuration
title: "AMCP: Java Agent Mesh Framework for Mobile & Distributed Systems"
description: "A Java-based open-source agentic framework implementing Agent Mesh concept with agent mobility and secure communication, inspired by IBM Aglets. Enterprise-grade multi-agent communication protocol for distributed systems."
url: "https://agentmeshcommunicationprotocol.github.io"
baseurl: ""
keywords: "java, agent-framework, distributed-systems, agent-mesh, agent-mobility, aglet, middleware, open-source, multi-agent, event-driven, LLM, microservices"

# Repository information
repository: "agentmeshcommunicationprotocol/amcp.github.io"
github_repository: "agentmeshcommunicationprotocol/amcpcore.github.io"

# Author information
author:
  name: "AMCP Development Team"
  email: "contact@amcp.dev"

# External links
amcp_core_url: "https://github.com/agentmeshcommunicationprotocol/amcpcore.github.io"
amcp_docs_url: "https://agentmeshcommunicationprotocol.github.io/amcp.github.io"

# Build settings
markdown: kramdown
highlighter: rouge
theme: minima

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Collections
collections:
  docs:
    output: true
    permalink: /:collection/:name/
  examples:
    output: true
    permalink: /:collection/:name/

# Navigation
navigation:
  - title: "Home"
    url: "/"
  - title: "Whitepaper"
    url: "/whitepaper/"
  - title: "Documentation"
    url: "/docs/"
  - title: "Examples"
    url: "/examples/"
  - title: "Download"
    url: "/download/"
  - title: "Community"
    url: "/community/"
  - title: "Blog"
    url: "/blog/"

# Social links
github_username: xaviercallens
twitter_username: amcp_framework

# SEO
lang: en
locale: en_US
image: "/assets/images/amcp-social.png"
logo: "/assets/images/amcp-logo.png"

# Analytics (add your tracking ID)
google_analytics: "G-0ZKTY3GTYQ"
google_search_console: # Add your verification code here

# SEO Tags
seo_tags:
  - "java"
  - "agent-framework"
  - "distributed-systems"
  - "agent-mesh"
  - "agent-mobility"
  - "aglet"
  - "middleware"
  - "open-source"
  - "multi-agent"
  - "event-driven"
  - "LLM"
  - "microservices"
  - "asynchronous-agents"
  - "publish-subscribe"
  - "agent-orchestration"

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - README.md
