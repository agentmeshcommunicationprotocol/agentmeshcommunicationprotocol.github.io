# AMCP GitHub Pages Configuration
title: "AMCP: Agentic Framework for Agent Mesh Communication Protocol - Kubernetes & Quarkus Ready"
description: "Enterprise-grade agentic framework for multi-agent systems. AMCP enables distributed agent mesh communication on Kubernetes, OpenShift, Quarkus, Kafka, and NATS. Java-based agent orchestration with LLM integration, agent mobility, and secure communication."
url: "https://agentmeshcommunicationprotocol.github.io"
baseurl: ""
keywords: "agentic, agent, agent mesh, agent framework, kubernetes agent, quarkus agent, openshift agent, kafka agent, nats agent, multi-agent system, distributed agents, agent orchestration, agent communication, agent mobility, java agent, event-driven agents, LLM agents, microservices, agent mesh communication protocol, cloud-native agents, containerized agents, serverless agents, edge agents"

# Repository information
repository: "agentmeshcommunicationprotocol/amcp.github.io"
github_repository: "agentmeshcommunicationprotocol/amcpcore.github.io"

# Author information
author:
  name: "AMCP Development Team"
  email: "contact@amcp.dev"

# External links
amcp_core_url: "https://github.com/agentmeshcommunicationprotocol/amcpcore.github.io"
amcp_docs_url: "https://agentmeshcommunicationprotocol.github.io/amcp.github.io"

# Build settings
markdown: kramdown
highlighter: rouge
theme: minima

# Exclude files and directories from Jekyll build
exclude:
  - "*.sh"
  - "*.py"
  - "amcp-core-project/"
  - "node_modules/"
  - "vendor/"
  - ".git/"
  - ".github/"
  - "Gemfile"
  - "Gemfile.lock"
  - "README.md"
  - "LICENSE"
  - ".gitignore"
  - "*_SUMMARY.md"
  - "*_REPORT.md"
  - "*_GUIDE.md"
  - "*_LOG.md"
  - "*_STATUS.md"
  - "*_FIX.md"

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Collections
collections:
  docs:
    output: true
    permalink: /:collection/:name/
  examples:
    output: true
    permalink: /:collection/:name/

# Navigation
navigation:
  - title: "Home"
    url: "/"
  - title: "Whitepaper"
    url: "/whitepaper/"
  - title: "Documentation"
    url: "/docs/"
  - title: "Examples"
    url: "/examples/"
  - title: "Download"
    url: "/download/"
  - title: "Community"
    url: "/community/"
  - title: "Blog"
    url: "/blog/"

